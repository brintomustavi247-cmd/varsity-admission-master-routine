<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Space Gradient -->
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1630" />
      <stop offset="50%" stop-color="#080D1F" />
      <stop offset="100%" stop-color="#03050E" />
    </linearGradient>

    <!-- Cyan Neon Gradient -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Crimson Glow Gradient -->
    <linearGradient id="neonCrimson" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1744" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>

    <!-- Glass Glare Gradient -->
    <linearGradient id="glassGlare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="rimGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#00F0FF" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#cyberBg)" stroke="#00F0FF" stroke-width="4" filter="url(#rimGlow)" />

  <!-- Inner Soft Aura Halo -->
  <circle cx="256" cy="240" r="150" fill="#00F0FF" opacity="0.15" />
  <circle cx="256" cy="240" r="90" fill="#00F0FF" opacity="0.1" />

  <!-- Holographic Tech Corner Diamonds -->
  <rect x="52" y="52" width="12" height="12" fill="#00F0FF" opacity="0.7" transform="rotate(45 58 58)" />
  <rect x="448" y="52" width="12" height="12" fill="#00F0FF" opacity="0.7" transform="rotate(45 454 58)" />
  <rect x="52" y="448" width="10" height="10" fill="#FF1744" opacity="0.7" transform="rotate(45 57 453)" />
  <rect x="448" y="448" width="10" height="10" fill="#FF1744" opacity="0.7" transform="rotate(45 453 453)" />

  <!-- Cyber Cat Silhouette & Visor Crest -->
  <g transform="translate(0, 10)">
    <!-- Cat Ears on Hoodie -->
    <!-- Left Ear -->
    <path d="M 170 190 L 140 100 L 220 145 Z" fill="#0C142A" stroke="#00F0FF" stroke-width="3" stroke-linejoin="round" />
    <path d="M 165 175 L 150 115 L 205 150 Z" fill="#00F0FF" opacity="0.25" />
    <!-- Right Ear -->
    <path d="M 342 190 L 372 100 L 292 145 Z" fill="#0C142A" stroke="#00F0FF" stroke-width="3" stroke-linejoin="round" />
    <path d="M 347 175 L 362 115 L 307 150 Z" fill="#00F0FF" opacity="0.25" />

    <!-- Hoodie Head Contour -->
    <ellipse cx="256" cy="235" rx="128" ry="118" fill="#0A1024" stroke="#00F0FF" stroke-width="3.5" />

    <!-- Dark Cyber Visor Face Mask -->
    <ellipse cx="256" cy="246" rx="94" ry="78" fill="#030611" stroke="#00F0FF" stroke-width="2" opacity="0.95" />

    <!-- Glowing Electric Cyan Visor Slit Eyes -->
    <g filter="url(#cyanGlow)">
      <!-- Left Slit Eye (Curved expressive oval) -->
      <ellipse cx="218" cy="242" rx="15" ry="26" transform="rotate(-15 218 242)" fill="#FFFFFF" />
      <ellipse cx="218" cy="242" rx="19" ry="30" transform="rotate(-15 218 242)" fill="#00F0FF" opacity="0.8" />
      <ellipse cx="218" cy="242" rx="14" ry="24" transform="rotate(-15 218 242)" fill="#FFFFFF" />

      <!-- Right Slit Eye (Curved expressive oval) -->
      <ellipse cx="294" cy="242" rx="15" ry="26" transform="rotate(15 294 242)" fill="#FFFFFF" />
      <ellipse cx="294" cy="242" rx="19" ry="30" transform="rotate(15 294 242)" fill="#00F0FF" opacity="0.8" />
      <ellipse cx="294" cy="242" rx="14" ry="24" transform="rotate(15 294 242)" fill="#FFFFFF" />

      <!-- Cute digital mouth / sensor dot -->
      <circle cx="256" cy="285" r="4" fill="#00F0FF" />
    </g>

    <!-- Hoodie Chest Rim & Cyber Energy Core -->
    <path d="M 160 340 Q 256 360 352 340 L 370 410 Q 256 440 142 410 Z" fill="#070C1E" stroke="#00F0FF" stroke-width="2" />
    <rect x="238" y="364" width="36" height="24" rx="6" fill="#00F0FF" filter="url(#cyanGlow)" />
  </g>

  <!-- Bottom Brand Plaque Bar -->
  <rect x="16" y="420" width="480" height="76" rx="0" fill="#050814" opacity="0.9" />
  <line x1="16" y1="420" x2="496" y2="420" stroke="#00F0FF" stroke-width="2" />
  <circle cx="256" cy="420" r="5" fill="#FF1744" filter="url(#cyanGlow)" />

  <!-- AURA Futuristic Branding Text -->
  <text x="256" y="468" text-anchor="middle" font-family="'Orbitron', 'Space Grotesk', system-ui, sans-serif" font-size="26" font-weight="900" letter-spacing="8" fill="#00F0FF">AURA</text>

  <!-- Top Glass Glare Overlay -->
  <path d="M 16 16 L 380 16 L 16 380 Z" fill="url(#glassGlare)" />
</svg>
